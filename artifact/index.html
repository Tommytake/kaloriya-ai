const r0 = n => Math.round(n || 0);
const f1 = n => (Math.round((n || 0) * 10) / 10).toFixed(1);
const todayStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const shift = (date, days) => { const d = new Date(date + 'T12:00:00'); d.setDate(d.getDate() + days); return todayStr(d); };
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const DAYS = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];

const sumItems = items => items.reduce((a, i) => ({ calories: a.calories + (+i.calories || 0), protein: a.protein + (+i.protein || 0), fat: a.fat + (+i.fat || 0), carbs: a.carbs + (+i.carbs || 0), grams: a.grams + (+i.grams || 0) }), { calories: 0, protein: 0, fat: 0, carbs: 0, grams: 0 });
const DEFAULT_PROFILE = { gender: 'erkak', age: 25, weight: 70, height: 175, activity: 1.375, goal: 'saqlash', customCalories: null };
function calcGoal(p) {
  if (p.customCalories > 0) return p.customCalories;
  const bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + (p.gender === 'erkak' ? 5 : -161);
  const adj = p.goal === 'ozish' ? -500 : p.goal === 'semirish' ? 400 : 0;
  return Math.max(1200, Math.round((bmr * p.activity + adj) / 10) * 10);
}
function confirmBox(text) {

}
async function resize(file, maxSide, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', q);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    return { dataUrl, blob };
  } finally { URL.revokeObjectURL(url); }
}

const store = {
  db: null, uid: null, meals: [], profile: { ...DEFAULT_PROFILE }, ready: false,
  lsGet(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  async init() {
    this.meals = this.lsGet('kaloriya.meals.v1', []);
    this.profile = { ...DEFAULT_PROFILE, ...this.lsGet('kaloriya.profile.v1', {}) };
    this.ready = true; render();
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      const base = 'data/users/' + uid;
      const timer = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000));
      const [mealsSnap, profSnap] = await Promise.race([Promise.all([db.collection(base + '/meals').get(), db.doc(base + '/settings/profile').get()]), timer]);
      const remote = (mealsSnap.docs || mealsSnap || []).map(d => (typeof d.data === 'function' ? d.data() : d.data ?? d));
      const ids = new Set(remote.map(m => m.id));
      const localOnly = this.meals.filter(m => !ids.has(m.id));
      this.meals = [...remote, ...localOnly];
      for (const m of localOnly) await this.dbSetMeal(m);
      const pd = profSnap && (typeof profSnap.data === 'function' ? profSnap.data() : profSnap.data);
      if (pd) this.profile = { ...DEFAULT_PROFILE, ...pd }; else await this.dbSetProfile();
      this.lsSet('kaloriya.meals.v1', this.meals); this.lsSet('kaloriya.profile.v1', this.profile);
      render();
    } catch (e) { console.warn('db unavailable, using local storage', e); this.db = null; }
  },
  async dbSetMeal(m) { if (this.db) try { await this.db.collection('data/users/' + this.uid + '/meals').doc(m.id).set(m); } catch (e) { console.warn(e); } },
  async addMeal(m) { this.meals.push(m); this.lsSet('kaloriya.meals.v1', this.meals); await this.dbSetMeal(m); },
  async deleteMeal(id) {
    this.meals = this.meals.filter(m => m.id !== id); this.lsSet('kaloriya.meals.v1', this.meals);
    if (this.db) try { await this.db.collection('data/users/' + this.uid + '/meals').doc(id).delete(); } catch (e) { console.warn(e); }
  },
  async clearMeals() { const ids = this.meals.map(m => m.id); this.meals = []; this.lsSet('kaloriya.meals.v1', []); for (const id of ids) if (this.db) try { await this.db.collection('data/users/' + this.uid + '/meals').doc(id).delete(); } catch {} },
  _pt: null,
  async dbSetProfile() { if (this.db) try { await this.db.doc('data/users/' + this.uid + '/settings/profile').set(this.profile); } catch (e) { console.warn(e); } },
  setProfile(p) { this.profile = p; this.lsSet('kaloriya.profile.v1', p); clearTimeout(this._pt); this._pt = setTimeout(() => this.dbSetProfile(), 600); },
};

function ring(value, max, size = 180, stroke = 14) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, pct = max > 0 ? Math.min(value / max, 1) : 0, over = value > max;
  return `<svg width="${size}" height="${size}" class="-rotate-90"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${over ? '#f97316' : '#34d399'}"/><stop offset="100%" stop-color="${over ? '#ef4444' : '#059669'}"/></linearGradient></defs>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="currentColor" stroke-width="${stroke}" fill="none" class="text-emerald-100 dark:text-white/10"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="url(#rg)" stroke-width="${stroke}" stroke-linecap="round" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" class="ring-anim"/></svg>`;
}
function macroBar(label, v, g, color) {
  const pct = g > 0 ? Math.min(v / g * 100, 100) : 0;
  return `<div><div class="mb-1.5 flex items-baseline justify-between text-sm"><span class="font-medium text-slate-600 dark:text-slate-300">${label}</span><span class="tabnum muted"><b class="strong">${r0(v)}</b> / ${r0(g)} g</span></div>

}

        ${m.thumb && m.thumb.startsWith('data:image/') ? `<img src="${m.thumb}" alt="" class="h-14 w-14 shrink-0 rounded-xl object-cover">` : '<div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl bg-emerald-100 text-2xl dark:bg-emerald-500/20">🍽️</div>'}
        <div class="min-w-0 flex-1"><div class="truncate font-medium strong">${esc(m.title)}</div><div class="truncate text-xs muted">${esc(m.items.map(i => i.name).join(', '))}</div>
          <div class="text-xs text-slate-400 tabnum">${String(tm.getHours()).padStart(2, '0')}:${String(tm.getMinutes()).padStart(2, '0')} · O ${r0(s.protein)} · Y ${r0(s.fat)} · U ${r0(s.carbs)}</div></div>
        <div class="text-right"><div class="font-bold strong tabnum">${r0(s.calories)}</div><button data-act="del" data-id="${esc(m.id)}" class="text-xs text-slate-400 hover:text-red-500">o'chirish</button></div></li>`; }).join('')}</ul></div>`;
  }).join('');
  return `<div class="fade-up space-y-4">
    <div class="flex items-center justify-between"><button data-act="day" data-v="-1" class="icon-btn" aria-label="Oldingi kun">‹</button><h2 class="text-lg font-bold strong">${pretty(date)}</h2><button data-act="day" data-v="1" ${date >= todayStr() ? 'disabled' : ''} class="icon-btn disabled:opacity-30" aria-label="Keyingi kun">›</button></div>
    <div class="glass flex flex-col items-center gap-6 rounded-3xl p-6 sm:flex-row">
      <div class="relative" style="width:180px;height:180px">${ring(t.calories, goal)}<div class="absolute inset-0 flex flex-col items-center justify-center text-center"><div class="text-4xl font-extrabold tracking-tight strong tabnum">${r0(Math.abs(left))}</div><div class="text-xs muted">${left >= 0 ? 'kkal qoldi' : 'kkal ortiqcha'}</div></div></div>
      <div class="w-full flex-1 space-y-3">
        <div class="grid grid-cols-2 gap-2 text-center"><div class="rounded-2xl bg-slate-50 p-3 dark:bg-white/5"><div class="text-xs muted">Iste'mol</div><div class="text-xl font-bold strong tabnum">${r0(t.calories)}</div></div><div class="rounded-2xl bg-slate-50 p-3 dark:bg-white/5"><div class="text-xs muted">Maqsad</div><div class="text-xl font-bold strong tabnum">${goal}</div></div></div>
        ${macroBar('Oqsil', t.protein, goal * .25 / 4, '#0ea5e9')}${macroBar("Yog'", t.fat, goal * .3 / 9, '#fbbf24')}${macroBar('Uglevod', t.carbs, goal * .45 / 4, '#8b5cf6')}
      </div>
    </div>
    <div class="glass rounded-3xl p-5">
      <h3 class="mb-4 font-semibold strong">So'nggi 7 kun</h3>
      <div class="relative flex h-36 items-end gap-2">
        <div class="pointer-events-none absolute inset-x-0 border-t border-dashed border-emerald-400/70" style="bottom:${goal / maxBar * 100}%"><span class="absolute -top-5 right-0 text-[10px] text-emerald-600 dark:text-emerald-400">maqsad</span></div>
        ${week.map(w => `<button data-act="setday" data-v="${w.d}" class="group flex h-full flex-1 flex-col items-center justify-end gap-1"><span class="text-[10px] muted tabnum opacity-0 transition group-hover:opacity-100">${r0(w.kcal)}</span>
          <div class="w-full rounded-t-lg transition-all duration-500 ${w.kcal > goal ? 'bg-gradient-to-t from-orange-400 to-red-400' : 'bg-gradient-to-t from-emerald-400 to-teal-400'} ${w.d === date ? 'opacity-100 ring-2 ring-emerald-500 ring-offset-2 dark:ring-offset-slate-900' : 'opacity-60'}" style="height:${Math.max(w.kcal / maxBar * 100, w.kcal > 0 ? 3 : 1)}%"></div></button>`).join('')}
      </div>
      <div class="mt-2 flex gap-2">${week.map(w => `<div class="flex-1 text-center text-xs muted">${DAYS[new Date(w.d + 'T12:00:00').getDay()]}</div>`).join('')}</div>
    </div>
    <div class="space-y-3">
      ${dayMeals.length ? groups : `<div class="glass rounded-3xl p-8 text-center"><div class="text-4xl">🥗</div><p class="mt-2 text-slate-600 dark:text-slate-300">Bu kunda hali ovqat qo'shilmagan</p>${date === todayStr() ? '<button data-tab="scan" class="btn-primary mx-auto mt-4">📷 Ovqatni skanerlash</button>' : ''}</div>`}
    </div>
  </div>`;
}

const ACTIVITIES = [[1.2, "Kam harakat (o'tirib ishlash)"], [1.375, "Yengil (haftada 1–3 mashg'ulot)"], [1.55, "O'rtacha (haftada 3–5 mashg'ulot)"], [1.725, 'Yuqori (har kuni sport)'], [1.9, "Juda yuqori (og'ir jismoniy ish)"]];
function seg(key, opts) { const v = store.profile[key]; return `<div class="flex rounded-xl bg-slate-100 p-1 dark:bg-white/10">${opts.map(([o, l]) => `<button type="button" data-act="prof" data-k="${key}" data-v="${o}" class="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition ${v === o ? 'bg-white text-emerald-600 shadow dark:bg-slate-800 dark:text-emerald-400' : 'text-slate-500 dark:text-slate-400'}">${l}</button>`).join('')}</div>`; }
function viewProfile() {
  const p = store.profile, goal = calcGoal(p), bmi = p.weight / (p.height / 100) ** 2;
  const bmiLabel = bmi < 18.5 ? 'Vazn yetishmaydi' : bmi < 25 ? "Me'yorda" : bmi < 30 ? 'Ortiqcha vazn' : 'Semizlik';
  const num = (k, suf) => `<div class="input flex items-center"><input type="number" data-pk="${k}" value="${p[k]}" class="w-full min-w-0 bg-transparent tabnum outline-none"><span class="ml-1 text-xs text-slate-400">${suf}</span></div>`;
  const field = (l, h) => `<label class="block"><span class="mb-1.5 block text-sm font-medium text-slate-600 dark:text-slate-300">${l}</span>${h}</label>`;
  return `<div class="fade-up space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-600 p-5 text-white shadow-lg shadow-emerald-500/30"><div class="text-sm opacity-80">Kunlik me'yor</div><div id="pGoal" class="text-3xl font-extrabold tabnum">${goal}</div><div class="text-sm opacity-80">kkal</div></div>
      <div class="glass rounded-3xl p-5"><div class="text-sm muted">Tana massasi indeksi</div><div id="pBmi" class="text-3xl font-extrabold strong tabnum">${isFinite(bmi) ? bmi.toFixed(1) : '–'}</div><div id="pBmiL" class="text-sm muted">${bmiLabel}</div></div>
    </div>
    <div class="glass space-y-5 rounded-3xl p-5">
      ${field('Jins', seg('gender', [['erkak', 'Erkak'], ['ayol', 'Ayol']]))}
      <div class="grid grid-cols-3 gap-3">${field('Yosh', num('age', 'yosh'))}${field('Vazn', num('weight', 'kg'))}${field("Bo'y", num('height', 'sm'))}</div>
      ${field('Faollik darajasi', `<select data-pk="activity" class="input">${ACTIVITIES.map(([v, l]) => `<option value="${v}" ${p.activity === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
      ${field('Maqsad', seg('goal', [['ozish', 'Ozish'], ['saqlash', 'Saqlash'], ['semirish', 'Vazn olish']]))}
      ${field("Me'yorni qo'lda belgilash (ixtiyoriy)", `<input type="number" data-pk="customCalories" placeholder="Avtomatik hisoblanadi" value="${p.customCalories ?? ''}" class="input">`)}
    </div>
    <div class="glass rounded-3xl p-5 text-sm muted">${store.db ? "Ma'lumotlaringiz Claude akkauntingizda shaxsiy saqlanadi — faqat siz ko'rasiz." : "Ma'lumotlaringiz shu brauzerda saqlanadi."}
      <button data-act="clear" class="mt-3 block font-medium text-red-500 hover:underline">Kundalikni tozalash</button></div>
  </div>`;
}
function refreshProfileStats() {
  const p = store.profile, bmi = p.weight / (p.height / 100) ** 2;
  $('#pGoal') && ($('#pGoal').textContent = calcGoal(p));
  $('#pBmi') && ($('#pBmi').textContent = isFinite(bmi) ? bmi.toFixed(1) : '–');
  $('#pBmiL') && ($('#pBmiL').textContent = bmi < 18.5 ? 'Vazn yetishmaydi' : bmi < 25 ? "Me'yorda" : bmi < 30 ? 'Ortiqcha vazn' : 'Semizlik');
  renderNav();
}

// ---------- actions ----------
async function handleFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { S.error = 'Iltimos, rasm faylini tanlang'; S.stage = 'error'; S.blob = null; return render(); }
  try {
    const big = await resize(file, 1280, .85), small = await resize(file, 200, .7);
    Object.assign(S, { preview: big.dataUrl, blob: big.blob, thumb: small.dataUrl, note: '', analysis: null, saved: false, stage: 'preview' });
  } catch { Object.assign(S, { error: "Rasmni o'qib bo'lmadi", stage: 'error', blob: null }); }
  render();
}
async function analyze() {
  S.note = $('#note')?.value ?? S.note;
  S.stage = 'loading'; render();
  const ac = new AbortController(); S.abort = ac;
  try {
    const sample = await getSample();
    if (!sample) { S.aiOk = false; throw { message: "AI tahlil uchun claude.ai akkauntingizga kirgan bo'lishingiz kerak." }; }
    const lim = await sample.limits?.().catch(() => null);
    if (lim && !lim.images) throw { message: 'Rasm tahlili hozircha mavjud emas.' };
    const input = PROMPT + (S.note ? `\nFoydalanuvchi izohi: ${S.note.slice(0, 300)}` : '');
    const res = await sample.json(input, { images: [S.blob], modelTier: 'default', signal: ac.signal, cache: false });
    if (ac.signal.aborted) return;
    const a = normalize(res);
    Object.assign(S, { analysis: a, items: a.items.map(i => ({ ...i })), base: a.items.map(i => ({ ...i })), mealType: guessMealType(), stage: 'result', aiOk: true });
  } catch (e) {
    if (ac.signal.aborted) return;
    console.warn(e);
    const code = e?.code;
    S.error = code === 'not_granted' ? "AI'dan foydalanishga ruxsat berilmadi." : code === 'rate_limited' ? "Juda ko'p so'rov. Birozdan so'ng urinib ko'ring." : e?.message && !code ? e.message : "Rasmni tahlil qilib bo'lmadi. Qayta urinib ko'ring.";
    S.stage = 'error';
  } finally { S.abort = null; }
  render();
}
function setGrams(i, g) {
  const b = S.base[i], k = b.grams > 0 ? g / b.grams : 0;
  S.items[i] = { ...S.items[i], grams: g, calories: b.calories * k, protein: b.protein * k, fat: b.fat * k, carbs: b.carbs * k };
  const it = S.items[i], t = sumItems(S.items), mc = t.protein * 4 + t.fat * 9 + t.carbs * 4 || 1;
  $('#kc' + i).textContent = r0(it.calories) + ' kkal';
  $('#mac' + i).textContent = `O ${f1(it.protein)} · Y ${f1(it.fat)} · U ${f1(it.carbs)} g`;
  $('#totK').textContent = r0(t.calories); $('#totG').textContent = r0(t.grams);
  for (const k of ['protein', 'fat', 'carbs']) $('#tot_' + k).textContent = f1(t[k]);
  $('#barP').style.width = t.protein * 400 / mc + '%'; $('#barF').style.width = t.fat * 900 / mc + '%'; $('#barC').style.width = t.carbs * 400 / mc + '%';
  document.querySelectorAll(`[data-g="${i}"]`).forEach(el => { if (document.activeElement !== el) el.value = r0(g); });
}
async function save() {
  if (!S.analysis || S.saved) return;
  S.saved = true; render();
  await store.addMeal({
    id: (crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(16).slice(2)), date: todayStr(), time: new Date().toISOString(),
    type: S.mealType, title: S.analysis.title, thumb: S.thumb,
    items: S.items.map(i => ({ name: i.name, grams: r0(i.grams), calories: r0(i.calories), protein: +f1(i.protein), fat: +f1(i.fat), carbs: +f1(i.carbs) })),
  });
  renderNav();
}

document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]');
  if (tb) { S.tab = tb.dataset.tab; if (S.tab === 'diary') S.date = S.date || todayStr(); render(); window.scrollTo({ top: 0 }); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'pick') $('#fileInput').click();
  else if (act === 'analyze') analyze();
  else if (act === 'cancel') { S.abort?.abort(); S.stage = 'preview'; render(); }
  else if (act === 'reset') { Object.assign(S, { stage: 'idle', preview: '', blob: null, analysis: null, items: [], error: '' }); render(); }
  else if (act === 'rm') { const i = +b.dataset.i; S.items.splice(i, 1); S.base.splice(i, 1); render(); }
  else if (act === 'mt') { S.mealType = b.dataset.v; render(); }
  else if (act === 'save') save();
  else if (act === 'day') { S.date = shift(S.date, +b.dataset.v); render(); }
  else if (act === 'setday') { S.date = b.dataset.v; render(); }
  else if (act === 'del') { if (await confirmBox("Ushbu yozuvni o'chirasizmi?")) { await store.deleteMeal(b.dataset.id); render(); } }
  else if (act === 'clear') { if (await confirmBox("Barcha kundalik yozuvlari o'chirilsinmi?")) { await store.clearMeals(); render(); } }
  else if (act === 'prof') { store.setProfile({ ...store.profile, [b.dataset.k]: b.dataset.v }); render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.g !== undefined) setGrams(+el.dataset.g, Math.max(0, +el.value || 0));
  else if (el.dataset.pk) {
    const k = el.dataset.pk; let v = el.value;
    v = k === 'customCalories' ? (v ? +v : null) : (+v || 0);
    store.setProfile({ ...store.profile, [k]: v }); refreshProfileStats();
  } else if (el.id === 'note') S.note = el.value;
});
$('#fileInput').addEventListener('change', e => { handleFile(e.target.files?.[0]); e.target.value = ''; });
document.addEventListener('dragover', e => { if (S.tab === 'scan' && S.stage === 'idle') { e.preventDefault(); $('#drop')?.classList.add('!border-emerald-400'); } });
document.addEventListener('dragleave', () => $('#drop')?.classList.remove('!border-emerald-400'));
document.addEventListener('drop', e => { if (S.tab === 'scan' && S.stage === 'idle') { e.preventDefault(); handleFile(e.dataTransfer.files?.[0]); } });

render();
store.init();
getSample().then(s => { S.aiOk = !!s; if (S.tab === 'scan' && S.stage === 'idle') render(); }).catch(() => {});
})();
</script>
</body>
</html>
